<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engaging UI</title>
    <link rel="stylesheet" href="ui.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <ul class="nav justify-content-end bg-black bg-gradient container-fluid" id="home">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#home">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#about">About</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#quote">Quote</a>
        </li>
    </ul>

    <section class="container">
        <div id="rocket">
            <span class="display-1">&#128640;</span>
        </div>
    </section>

    <h1 class="text-light container">Welcome to the Space tour</h1>

    <div class="img container">
        <img src="../images/image-removebg-preview (1).png" alt="astro">
    </div>

    <div class="container" id="about">
        <div class="row">
            <div class="col-sm-6 mb-3 mb-sm-0">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title text-light">Solar System</h5>
                        <p class="card-text">Our solar system is one of many miracles happened after the big bang.</p>
                        <a href="https://science.nasa.gov/solar-system/" class="btn btn-primary">Explore the Solar System</a>
                    </div>
                </div>
            </div>

            <div class="col-sm-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title text-light">Milkyway</h5>
                        <p class="card-text">Our galaxy has so many more such solar systems yet to explore.</p>
                        <a href="https://en.wikipedia.org/wiki/Milky_Way" class="btn btn-primary">Explore the Milkyway</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <br>

    <div class="card container">
        <div class="card-body" id="quote">
            <figure class="container">
                <blockquote class="blockquote text-light">
                    <p>"When you look at the stars and the galaxy, you feel that you are not just from any particular piece of land, but from the solar system."
                </blockquote>
                <figcaption class="blockquote-footer">
                    <cite title="Source Title">Kalpana Chawla</cite>
                </figcaption>
            </figure>
        </div>
    </div>
</body>
</html>
