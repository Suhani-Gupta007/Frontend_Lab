<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Write a JavaScript function to find the factorial of a given number.</h1>
    <script>
        var n = prompt();
        n = Number(n);
        function factorial(n){
            var fact = 1;
        for(var i = n; i > 0; i--){
            fact *= i;
        }
        console.log(fact);
        document.write(fact);
        }
        factorial(n);
    </script>
</body>
</html>
